      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#4fd8f0" stroke-width="1.2" fill="none" opacity="0.85" filter="url(#glow)">
    <!-- Sumatra -->
    <polygon points="60,90 90,70 130,75 160,95 170,130 150,160 110,165 70,145 50,115"/>
    <polygon points="90,70 130,75 120,105 85,100"/>
    <polygon points="130,75 160,95 150,125 120,105"/>
    <!-- Java -->
