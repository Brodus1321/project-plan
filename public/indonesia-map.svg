    <polygon points="260,165 330,170 310,190 250,185"/>
    <polygon points="330,170 400,180 380,200 310,190"/>
    <!-- Kalimantan -->
    <polygon points="230,60 300,45 370,55 400,90 380,130 320,145 260,140 220,105"/>
    <polygon points="300,45 370,55 350,85 290,80"/>
    <polygon points="370,55 400,90 375,115 350,85"/>
    <!-- Sulawesi -->
    <polygon points="420,70 460,60 490,80 485,115 460,130 430,120 425,95"/>
    <polygon points="460,60 490,80 475,100 455,85"/>
    <!-- Papua -->
