  <g fill="#4fd8f0" opacity="0.9" filter="url(#glow)">
    <circle cx="110" cy="110" r="2.5"/><circle cx="150" cy="120" r="2"/>
    <circle cx="280" cy="185" r="2.5"/><circle cx="350" cy="190" r="2"/><circle cx="400" cy="195" r="2"/>
    <circle cx="300" cy="90" r="2.5"/><circle cx="360" cy="80" r="2"/>
    <circle cx="460" cy="90" r="2.5"/><circle cx="475" cy="100" r="2"/>
    <circle cx="600" cy="95" r="2.5"/><circle cx="670" cy="100" r="2"/><circle cx="710" cy="120" r="2"/>
    <circle cx="460" cy="200" r="2"/>
